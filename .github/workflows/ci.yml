name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rentvest
          POSTGRES_PASSWORD: rentvest
          POSTGRES_DB: rentvest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://rentvest:rentvest@localhost:5432/rentvest?schema=public
      AUTH_SECRET: ci-test-secret-minimum-32-characters-long
      JWT_ACCESS_SECRET: ci-jwt-access-secret-min-32-chars
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-min-32-chars
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma db push
      - run: npm run test
      - run: npm run build
