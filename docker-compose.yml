services:
  postgres:
    image: postgres:16-alpine
    container_name: rentvest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentvest
      POSTGRES_PASSWORD: rentvest
      POSTGRES_DB: rentvest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentvest"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rentvest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: payrent-backend/Dockerfile
    container_name: payrent-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./payrent-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: payrent-frontend/Dockerfile
    container_name: payrent-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:3001
      AUTH_URL: http://localhost:3000
    env_file:
      - ./payrent-frontend/.env
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
